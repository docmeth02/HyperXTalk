name: Build HyperXTalk — Universal macOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - 'feature/universal-macos-binary'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS Universal Binary (x86_64 + arm64) on Apple Silicon runner
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS Universal
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode licence
        run: sudo xcodebuild -license accept

      - name: Install Homebrew dependencies
        run: |
          brew install openssl@3 libpq mysql-client pixman meson ninja pkg-config
          brew install --cask vlc

      - name: Set up Java (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure
        run: make config-mac

      - name: Build prebuilt libraries
        run: make prebuilt-mac
        env:
          BUILDTYPE: ${{ inputs.build_type || 'Release' }}

      - name: Compile arm64
        run: make compile-mac CODESIGN_IDENTITY="-" XCODEBUILD="xcodebuild ARCHS=arm64"
        env:
          BUILDTYPE: ${{ inputs.build_type || 'Release' }}

      - name: Save arm64 build
        run: |
          mkdir -p builds
          cp -R mac-bin builds/mac-bin-arm64
          cp -R _build/mac/${{ inputs.build_type || 'Release' }} builds/_build-arm64

      - name: Compile x86_64
        run: |
          rm -rf mac-bin _build/mac/${{ inputs.build_type || 'Release' }} _cache/mac/${{ inputs.build_type || 'Release' }}
          make compile-mac CODESIGN_IDENTITY="-" XCODEBUILD="xcodebuild ARCHS=x86_64"
        env:
          BUILDTYPE: ${{ inputs.build_type || 'Release' }}

      - name: Save x86_64 build
        run: |
          cp -R mac-bin builds/mac-bin-x86_64
          cp -R _build/mac/${{ inputs.build_type || 'Release' }} builds/_build-x86_64

      - name: Create universal binary
        run: |
          # The arm64 app bundle is the base — lipo x86_64 binaries into it
          mkdir -p universal
          cp -R builds/mac-bin-arm64/HyperXTalk.app universal/

          echo "=== Lipo'ing Mach-O binaries ==="
          find universal/HyperXTalk.app -type f | while read F; do
            if file "$F" | grep -q "Mach-O"; then
              REL="${F#universal/HyperXTalk.app/}"
              X86="builds/mac-bin-x86_64/HyperXTalk.app/$REL"
              if [ -f "$X86" ] && file "$X86" | grep -q "Mach-O"; then
                echo "  Universal: $REL"
                lipo -create "$F" "$X86" -o "$F" || echo "    WARN: lipo failed for $REL"
              else
                echo "  ARM64-only: $REL"
              fi
            fi
          done

          # Re-sign the universal bundle
          echo "=== Re-signing ==="
          codesign --force --sign - --options runtime --entitlements HyperXTalk.entitlements universal/HyperXTalk.app || true

          # Verify
          echo "=== Verification ==="
          file universal/HyperXTalk.app/Contents/MacOS/HyperXTalk
          lipo -info universal/HyperXTalk.app/Contents/MacOS/HyperXTalk

          # Package into a zip
          cd universal
          zip -r ../HyperXTalk-macOS-Universal.zip .
          cd ..
          cp HyperXTalk-macOS-Universal.zip mac-bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperXTalk-macOS-Universal-${{ inputs.build_type || 'Release' }}
          path: HyperXTalk-macOS-Universal.zip
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release (only on v* tags)
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: HyperXTalk-macOS-Universal-Release
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/HyperXTalk-macOS-Universal.zip
