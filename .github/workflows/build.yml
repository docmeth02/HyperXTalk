name: Build HyperXTalk — Universal macOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    tags:
      - 'v*'
    branches:
      - 'feature/universal-macos-binary'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS Universal Binary (x86_64 + arm64)
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS Universal
    runs-on: macos-15        # macOS 15 Sequoia — Apple Silicon (ARM64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Xcode licence
        run: sudo xcodebuild -license accept

      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install x86_64 Homebrew
        run: |
          # Install x86_64 Homebrew to /usr/local for x86_64 dependencies
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          # Make x86_64 brew available
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Install ARM64 Homebrew dependencies
        run: |
          brew install openssl@3 libpq mysql-client pixman meson ninja pkg-config
          brew install --cask vlc

      - name: Install x86_64 Homebrew dependencies
        run: |
          # Install x86_64 versions of the libraries we need for universal binaries
          arch -x86_64 /usr/local/bin/brew install openssl@3 libpq mysql-client pixman

      - name: Set up Java (Temurin — required by libfoundation JNI bindings)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure (GYP → Xcode projects)
        run: make config-mac

      - name: Build prebuilt third-party libraries (universal)
        run: make prebuilt-mac
        env:
          BUILDTYPE: ${{ inputs.build_type || 'Release' }}

      - name: Compile (universal binary)
        run: make compile-mac CODESIGN_IDENTITY="-" XCODEBUILD_EXTRA="ONLY_ACTIVE_ARCH=NO"
        env:
          BUILDTYPE: ${{ inputs.build_type || 'Release' }}

      - name: Package (mac-bin)
        run: make package-mac-bin CODESIGN_IDENTITY="-"
        env:
          BUILDTYPE: ${{ inputs.build_type || 'Release' }}

      - name: Verify binary architectures
        run: |
          echo "=== Verifying universal binary ==="
          file mac-bin/HyperXTalk.app/Contents/MacOS/HyperXTalk
          lipo -info mac-bin/HyperXTalk.app/Contents/MacOS/HyperXTalk || true
          echo "=== Standalone engines ==="
          file mac-bin/HyperXTalk.app/Contents/Tools/Runtime/Mac\ OS\ X/arm64/Standalone.app/Contents/MacOS/HyperXTalk-Standalone
          file mac-bin/HyperXTalk.app/Contents/Tools/Runtime/Mac\ OS\ X/x86_64/Standalone.app/Contents/MacOS/HyperXTalk-Standalone

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperXTalk-macOS-Universal-${{ inputs.build_type || 'Release' }}
          path: mac-bin/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release (only on v* tags)
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package artifacts for release
        run: |
          cd artifacts
          if [ -d "HyperXTalk-macOS-Universal-Release" ]; then
            (cd HyperXTalk-macOS-Universal-Release && zip -r ../HyperXTalk-macOS-Universal.zip .)
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/HyperXTalk-macOS-Universal.zip
